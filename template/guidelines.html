<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Guidelines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .guidelines {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #fff;
        }
        .guidelines h5 {
            margin-bottom: 10px;
        }

        /* Make the anchor tag text white and larger */
        .guidelines a {
            color: white; /* Change text color to white */
            text-decoration: none;
            font-size: 18px; /* Make the text size larger */
            padding: 10px 20px; /* Add padding for larger clickable area */
            display: block; /* Make anchor tag a block element so it takes up the entire button area */
        }

        /* On hover, add underline effect */
        .guidelines a:hover {
            text-decoration: underline;
        }

        /* Style buttons to ensure the link looks like a button */
        .btn a {
            display: block; /* Ensure the anchor takes the full button area */
            color: white; /* Text color */
            font-size: 18px; /* Larger text */
            padding: 10px 20px; /* Increase padding */
            text-decoration: none; /* Remove underline */
        }

        /* Button hover effects */
        .btn:hover a {
            text-decoration: underline; /* Underline on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Department Guidelines</h1>

        <!-- Buttons for departments -->
        <div class="d-grid gap-2 col-6 mx-auto">
            <button class="btn btn-success">
                <a href="{{ url_for('static', filename='Forest.pdf') }}" target="_blank">Forest Department</a>
            </button>
            <button class="btn btn-danger">
                <a href="{{ url_for('static', filename='FireDepartment.pdf') }}" target="_blank">Fire Department</a>
            </button>
            <button class="btn btn-warning">
                <a href="{{ url_for('static', filename='MCD.pdf') }}" target="_blank">MCD</a>
            </button>
            <button class="btn btn-primary">
                <a href="{{ url_for('static', filename='Nal-Jal-Mitra-Guidelines.pdf') }}" target="_blank">Jal Vibhag</a>
            </button>
            <!-- Indian Railways button -->
            <button class="btn btn-secondary">
                <a href="{{ url_for('static', filename='Railways.pdf') }}" target="_blank">Indian Railways</a>
            </button>
        </div>

        <!-- Guidelines Display Section -->
        <div id="guidelinesSection" class="guidelines mt-4">
            <h5>Select a department to view its guidelines.</h5>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Function to display guidelines for the selected department
        function showGuidelines(department) {
            const guidelinesSection = document.getElementById('guidelinesSection');
            guidelinesSection.innerHTML = departmentGuidelines[department] || '<h5>No guidelines available for this department.</h5>';
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
